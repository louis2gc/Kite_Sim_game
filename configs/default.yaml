# EXPERIMENTAL rigid-body adaptation, illustrative parameters, not a measured kite.
# Fechner 2015 Eqs. 47–59 + KiteUtils.jl polar snapshot (2026-11-08).
# See docs/PHYSICS.md for exact sources, equations and assumptions.
area: 12.0
mass: 2.9
line_length: 25.0
# Source reference geometry, not lab measurements. Body origin is COM.
width: 5.77
height: 2.23
relative_width: 0.9
nose_distance: 0.2
nose_mass_fraction: 0.47
top_mass_fraction: 0.4
# null = estimate from four point masses; replace with measured 3x3 kg m² tensor.
inertia: null
# Provisional effective attachment/anchor coordinates [m], in B / G respectively.
attachments: [[-0.5, 1.2, 0.8], [-0.5, -1.2, 0.8]]
anchors: [[0, 0, 0], [0, 0, 0]]
# L0=l-gain*dm/2, L1=l+gain*dm/2; NOT the old empirical roll law.
line_gain: 1.0
side_area_ratio: 0.306
alpha_zero_deg: 4.0
alpha_tip_deg: 10.0
# Playable depower range for this rigid geometry. The source 31-degree KCU
# range can unload a line during combined depower/steering transients.
depower_angle_deg: 10.0
# Fechner reference maximum differential side-incidence angle. Sign is mapped
# to this game's positive-left motor convention in fechner_aero.py.
steering_twist_deg: 16.83
# Smooth, critically damped servo: the former 78 rad/s position servo imposed
# unrealistic line accelerations on this ideal inextensible two-line model.
# These response parameters are game defaults, not measured hardware settings.
motor_omega: 10.0
motor_zeta: 1.0
alpha_cl: [-180, -160, -90, -20, -10, -5, 0, 20, 40, 90, 160, 180]
cl: [0, 0.5, 0, 0.08, 0.125, 0.15, 0.2, 1, 1, 0, -0.5, 0]
alpha_cd: [-180, -170, -140, -90, -20, 0, 20, 90, 140, 170, 180]
cd: [0.5, 0.5, 0.5, 1, 0.2, 0.1, 0.2, 1, 0.5, 0.5, 0.5]
initial_theta_deg: 70.0
initial_phi_deg: 0.0
initial_heading_deg: 0.0
initial_pitch_deg: 0.0
initial_course_deg: 0.0
initial_speed: 0.0
wind_speed: 8.0
dt: 0.005
